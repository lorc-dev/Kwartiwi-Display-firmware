## IDF Component Manager Manifest File
dependencies:
  ## LVGL 8.3.x is required by the UI code (LVGL 9 is not source compatible)
  lvgl/lvgl: "~8.3.11"
  espressif/mdns: "^1.14.0"
  ## ESP-MQTT was moved out of ESP-IDF into a managed component in v6.0
  espressif/mqtt: "^1.1.0"
  ## The built-in JSON component was removed from ESP-IDF in v6.0
  espressif/cjson: "^1.7.19"
  ## Required IDF version
  idf:
    version: ">=6.0"
